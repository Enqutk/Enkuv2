<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projects — Enku Taddesse</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Enqutk/Enkuv2@main/style.css">
    <link rel="stylesheet" href="style.css" onerror="this.onerror=null; this.href='style.css';">
    <link rel="stylesheet" href="/minimal.css?v=6">
    
    <!-- Apply theme immediately to prevent flash - DEFAULT TO DARK MODE -->
    <script>
      // Global theme toggle function - works with inline onclick
      window.toggleTheme = function(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        
        const body = document.body;
        const html = document.documentElement;
        const toggle = document.getElementById('theme-toggle');
        
        const isDark = !body.classList.contains('dark-mode');
        
        if (isDark) {
          body.classList.add('dark-mode');
          html.classList.add('dark-mode');
          if (toggle) toggle.textContent = '☀️';
          try {
            localStorage.setItem('theme', 'dark-mode');
            localStorage.setItem('theme_preference', 'dark');
          } catch(err) {}
        } else {
          body.classList.remove('dark-mode');
          html.classList.remove('dark-mode');
          if (toggle) toggle.textContent = '🌙';
          try {
            localStorage.setItem('theme', 'light-mode');
            localStorage.setItem('theme_preference', 'light');
          } catch(err) {}
        }
      };
      
      // Initialize theme on page load
      (function() {
        try {
          let theme = localStorage.getItem('theme');
          if (!theme) {
            const oldTheme = localStorage.getItem('theme_preference');
            if (oldTheme === 'dark') {
              theme = 'dark-mode';
            } else if (oldTheme === 'light') {
              theme = 'light-mode';
            } else {
              // DEFAULT TO DARK MODE if no preference exists
              theme = 'dark-mode';
              localStorage.setItem('theme', 'dark-mode');
              localStorage.setItem('theme_preference', 'dark');
            }
          }
          
          // Apply theme immediately
          if (theme === 'dark-mode') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
          }
        } catch(e) {
          // If localStorage fails, default to dark mode
          document.documentElement.classList.add('dark-mode');
          document.body.classList.add('dark-mode');
        }
      })();
      
      // Update button icon when DOM is ready
      function updateToggleIcon() {
        const toggle = document.getElementById('theme-toggle');
        if (toggle) {
          if (document.body.classList.contains('dark-mode')) {
            toggle.textContent = '☀️';
          } else {
            toggle.textContent = '🌙';
          }
        } else {
          setTimeout(updateToggleIcon, 50);
        }
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateToggleIcon);
      } else {
        updateToggleIcon();
      }
    </script>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/">Enku Taddesse</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Open menu">
                <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/projects">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="/blog">Blog</a></li>

                </ul>
                <div class="nav-actions">
                    <a href="/admin" id="admin-link" class="btn btn-gold btn-sm" style="display: none;">Admin</a>

    <section class="projects-hero">
        <div class="container">
            <div class="ba-section-head mb-0">
                <p class="ba-label">Work</p>
                <hr class="ba-line">
            </div>
            <h1 class="projects-hero-title mt-3 mb-2">Projects</h1>
            <p class="projects-hero-subtitle text-muted mb-0">Selected projects, plugins, and prototypes</p>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="py-5">
        <div class="container">
            <!-- Filters Section -->
            <div class="projects-filters-wrapper mb-5">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
                    <div class="projects-filters-label">
                        <span class="text-muted small fw-semibold text-uppercase letter-spacing-1">Filter by</span>
                    </div>
                    <div id="projects-filters" class="projects-filters-group" role="group" aria-label="project filters">
                        <button class="filter-btn active" data-filter="*">
                            <span>All</span>
                            <span class="filter-count" id="filter-count-all"></span>
                        </button>
                        <button class="filter-btn" data-filter="intern">
                            <span>Intern</span>
                        </button>
                        <button class="filter-btn" data-filter="web">
                            <span>Web</span>
                        </button>
                        <button class="filter-btn" data-filter="wp">
                            <span>WordPress</span>
                        </button>
                        <button class="filter-btn" data-filter="mobile">
                            <span>Mobile</span>
                        </button>
                        <button class="filter-btn" data-filter="game">
                            <span>Game</span>
                        </button>
                        <button class="filter-btn" data-filter="team">
                            <span>Team</span>
                        </button>
                        <button class="filter-btn" data-filter="solo">
                            <span>Individual</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Projects Grid -->
            <div id="projects-grid" class="projects-grid">
                <!-- Projects will be loaded here -->
            </div>

            <!-- Empty State -->
            <div id="projects-empty" class="projects-empty-state text-center py-5" style="display: none;">
                <div class="empty-icon mb-3">🔍</div>
                <h4 class="fw-bold mb-2">No projects found</h4>
                <p class="text-muted">Try selecting a different filter</p>
            </div>
        </div>

        <!-- Project Modal -->
        <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content project-modal-content border-0">
                    <div class="modal-header project-modal-header border-0">
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body project-modal-body p-0">
                        <div id="project-modal-content">
                            <!-- injected content -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-4 bg-dark text-white">
        <div class="container text-center">
            <small>&copy; <span id="footer-year"></span> Enku Taddesse. All rights reserved.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="/script.js?v=6"></script>
    <script>
        $(function() {
            $('#footer-year').text(new Date().getFullYear());
            
            // Load projects from script.js
            if (typeof loadProjects === 'function') {
                loadProjects();
            }

            // Theme toggle - use universal function from script.js if available
            if (typeof window.initThemeToggle === 'function') {
                window.initThemeToggle();
            } else {
                // Fallback if script.js not loaded
                const themeToggleBtn = $('#theme-toggle');
                const body = $('body');
                let savedTheme = localStorage.getItem('theme');
                
                if (!savedTheme) {
                    const oldSaved = localStorage.getItem('theme_preference');
                    if (oldSaved === 'dark') {
                        savedTheme = 'dark-mode';
                        localStorage.setItem('theme', savedTheme);
                    } else if (oldSaved === 'light') {
                        savedTheme = 'light-mode';
                        localStorage.setItem('theme', savedTheme);
                    } else {
                        // DEFAULT TO DARK MODE
                        savedTheme = 'dark-mode';
                        localStorage.setItem('theme', 'dark-mode');
                        localStorage.setItem('theme_preference', 'dark');
                    }
                }
                
                if (savedTheme === 'dark-mode') {
                    body.addClass('dark-mode');
                    document.documentElement.classList.add('dark-mode');
                    themeToggleBtn.text('☀️');
                } else {
                    body.removeClass('dark-mode');
                    document.documentElement.classList.remove('dark-mode');
                    themeToggleBtn.text('🌙');
                }
                
                themeToggleBtn.off('click').on('click', function(){
                    body.toggleClass('dark-mode');
                    const isDarkMode = body.hasClass('dark-mode');
                    if (isDarkMode) {
                        document.documentElement.classList.add('dark-mode');
                    } else {
                        document.documentElement.classList.remove('dark-mode');
                    }
                    $(this).text(isDarkMode ? '☀️' : '🌙');
                    localStorage.setItem('theme', isDarkMode ? 'dark-mode' : 'light-mode');
                    localStorage.setItem('theme_preference', isDarkMode ? 'dark' : 'light');
                });
            }

            // Check if user is logged in as admin and show admin link
            (async function() {
                if (typeof api !== 'undefined' && api.token) {
                    try {
                        const user = await api.getCurrentUser();
                        if (user && user.user && user.user.role === 'admin') {
                            $('#admin-link').removeClass('d-none').show();
                        }
                    } catch (error) {
                        // Not logged in or not admin, hide the link
                        console.log('Admin check failed:', error);
                    }
                }
            })();
        });
    </script>
</body>
</html>
